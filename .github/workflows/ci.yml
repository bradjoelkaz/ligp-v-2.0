name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master", "phase-*"]

jobs:
  lint-and-validate:
    name: Lint + Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install ruff black pyyaml pytest

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Validate config YAML loads
        run: |
          python -c "
          import yaml, pathlib
          for f in pathlib.Path('config').glob('*.yaml'):
              yaml.safe_load(f.read_text())
          print('All YAML configs OK')
          "

      - name: Run tests
        run: pytest tests/unit/ -x -q
