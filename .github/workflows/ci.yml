name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master", "phase-*"]

jobs:
  lint-and-validate:
    name: Lint + Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install ruff black pyyaml

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Validate config YAML loads
        run: |
          python -c "
          import yaml, pathlib
          for f in pathlib.Path('config').glob('*.yaml'):
              yaml.safe_load(f.read_text())
          print('All YAML configs OK')
          "

  unit-tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Unit tests are offline-safe (heavy libs are lazy-imported with
      # fallbacks), so we only need a light toolchain here.
      - name: Install dependencies
        run: pip install pyyaml pytest pytest-cov

      - name: Run unit tests with coverage
        run: pytest tests/unit/ -q --cov --cov-report=term-missing --cov-fail-under=90

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml pytest

      - name: Run integration tests
        run: pytest tests/integration/ -q
