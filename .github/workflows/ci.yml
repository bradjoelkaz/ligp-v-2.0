name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master", "phase-*"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---- Job 1: lint + format + config validation ----------------------------
  lint:
    name: Lint + Format + Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint/runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Validate config YAML loads
        run: |
          python -c "
          import yaml, pathlib
          for f in pathlib.Path('config').glob('*.yaml'):
              yaml.safe_load(f.read_text())
          print('All YAML configs OK')
          "

  # ---- Job 2: unit tests + coverage ----------------------------------------
  # Runs the full unit suite (Phase 1-7 + Phase 8). Coverage is gated at 90%
  # on the deterministic core packages declared in pyproject [tool.coverage].
  unit:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit -q \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ---- Job 3: docker image build -------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: iigp-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image boots
        run: |
          docker run -d --name iigp-ci -p 8000:8000 iigp-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then echo "OK"; break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/metrics | head -n 5
          docker rm -f iigp-ci

  # ---- Job 4: integration tests --------------------------------------------
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: iigp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . 2>/dev/null || true

      - name: Run integration + e2e tests
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/iigp_test
        run: pytest tests/integration tests/e2e -q
