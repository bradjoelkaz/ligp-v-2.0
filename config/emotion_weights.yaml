# =============================================================================
# IIGP v2.0 — emotion_weights.yaml  (DD-005 / QA — Layer 5)
# EmotionBoost = Σ ( emotion_weight[e] × P(e | text) )
# 6-class emotion model; weights are revenue boost multipliers.
# =============================================================================

model: j-hartmann/emotion-english-distilroberta-base
multilingual_model: cardiffnlp/twitter-xlm-roberta-base-sentiment

emotion_weights:
  joy: 1.2
  fear: 1.4
  anger: 1.3
  surprise: 1.5
  sadness: 0.8
  neutral: 1.0

# Boost is clamped to avoid runaway multipliers from noisy classification.
boost_bounds:
  min: 0.5
  max: 1.8

# Minimum probability for an emotion to contribute to the boost.
min_probability: 0.10

# Aggregation across the 6 classes for the final EmotionBoost scalar.
aggregation: weighted_sum          # weighted_sum | max | top_k_weighted_sum
top_k: 2
