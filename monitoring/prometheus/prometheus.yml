# Prometheus scrape configuration for the IIGP v2.0 observability stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: iigp
    env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: iigp-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: iigp-api
